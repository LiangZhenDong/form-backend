name = "form-backend"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
RATE_LIMIT_PER_MINUTE = "10"
# Sender for email notifications; must be an address on a zone with Email Routing enabled.
MAIL_FROM = ""

[[d1_databases]]
binding = "DB"
database_name = "form-backend"
# Paste the id printed by `wrangler d1 create form-backend`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Email notifications: uncomment after enabling Email Routing on your zone.
# send_email can only deliver to *verified* Email Routing destination addresses.
# [[send_email]]
# name = "EMAIL"

# Custom domain (optional):
# routes = [{ pattern = "form.example.com", custom_domain = true }]
